name: Weekly backup
# Copies every Dirary table (data only; the schema is in supabase/migrations), encrypts the copy with your
# passphrase and keeps it as a workflow artifact for 90 days. Only the encrypted file ever leaves the runner.
# Setup and restore: docs/BACKUP.md.
on:
  schedule:
    - cron: '17 18 * * 6' # Sundays 02:17 in Manila (Saturday 18:17 UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check the secrets are set
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Add the SUPABASE_DB_URL and BACKUP_PASSPHRASE repository secrets first (docs/BACKUP.md)."
            exit 1
          fi
          if [ "${#BACKUP_PASSPHRASE}" -lt 20 ]; then
            echo "::error::BACKUP_PASSPHRASE should be at least 20 characters. This repository is public, so the encryption is what keeps the backup private."
            exit 1
          fi

      - name: Install pg_dump 18 (it can read any older Postgres)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18 > /dev/null
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Dump, compress and encrypt
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          stamp=$(date -u +%Y-%m-%d)
          out="$RUNNER_TEMP/dirary-backup-$stamp.sql.gz.gpg"
          # Plain text never touches the disk: pg_dump → gzip → gpg, in one pipe.
          /usr/lib/postgresql/18/bin/pg_dump "$SUPABASE_DB_URL" \
              --data-only --schema=public --exclude-table=public.sync_probe --no-owner --no-privileges \
            | gzip -9 \
            | gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 -o "$out" 3<<<"$BACKUP_PASSPHRASE"
          # An empty or failed dump would still make a small file; refuse anything that looks wrong.
          size=$(stat -c %s "$out")
          if [ "$size" -lt 512 ]; then echo "::error::The backup is suspiciously small ($size bytes)."; exit 1; fi
          echo "BACKUP_FILE=$out" >> "$GITHUB_ENV"
          echo "Encrypted backup: $(basename "$out"), $size bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: dirary-backup-${{ github.run_number }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
